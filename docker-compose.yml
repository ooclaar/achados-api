# Sobe tudo com um comando: docker compose up --build
# Os valores depois de ":-" são padrões de desenvolvimento local; um arquivo .env os substitui.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-achados}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dados_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-achados}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Teste de carga: docker compose --profile carga run --rm --build k6
  # O script é copiado para a imagem (sem bind mount), então roda igual em qualquer máquina.
  k6:
    build:
      context: ./tests/carga
      dockerfile_inline: |
        FROM grafana/k6:latest
        COPY smoke.js /scripts/smoke.js
    profiles: ["carga"]
    command: ["run", "/scripts/smoke.js"]
    environment:
      BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  dados_db:
