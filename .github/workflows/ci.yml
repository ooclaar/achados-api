name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, tipos, testes e coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: achados
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d achados"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      # Banco descartável do próprio job; não é um segredo de ambiente real.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/achados

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Lint do OpenAPI
        run: npm run lint:api

      - name: Testes (unitários + integração) com coverage mínimo
        run: npm test

  segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Varre o histórico inteiro a cada execução; falha se encontrar qualquer segredo.
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks

      - name: Procurar segredos no histórico
        run: /tmp/gitleaks detect --source . --redact --verbose
